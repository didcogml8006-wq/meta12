<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            /* flex-direction: row; */
        }
        .sideber {
            background-color: aqua;
            /* 고정 가로 너비 200px */
            flex: 1;
        }
        .main {
            background-color: antiquewhite;
            /* flex: 1 1 0 을 의미함 */
            flex: 2;
        }
    </style>
</head>
<body>
    <h3>flexbox 기본 예제</h3>
    <div class="container">
        <div class="sideber">사이드바</div>
        <div class="main">메인컨텐츠</div>
        <div class="sideber">사이드바</div>
    </div>
</body>
</html>
