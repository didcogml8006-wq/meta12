<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>중첩 Flexbox 레이아웃</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      /* 전체 */
      .page {
         display: flex;
         flex-direction: column;
         height: 100%;
      }

      /* 헤더 */
      .header {
         display: flex;
         justify-content: space-between;
         padding: 15px 30px;
         background: #2f3640;
         color: white;
        /* 
         background-color: navy;
         text-align: center;
         padding: 20px; 
        */
      }

      .logo {
         background: #353b48;
         padding: 10px 20px;
        /* 
         background-color: gray;
         text-align: center;
         padding: 10px;
         color: white; 
        */
      }

      .util { 
         background: #718093;
         padding: 10px 20px;
        /* 
         background-color: gray;
         text-align: center;
         padding: 10px;
         color: white; 
        */
      }

      /* 메인 */
      .main {
         display: flex;
         flex: 1;
        /* 
         background-color: white;
         flex: 3;
         padding: 20px; 
        */
      }

      /* 사이드바 */
      .sidebar {
         width: 240px;
         background: #dcdde1;
         padding: 20px;
         display: flex;
         flex-direction: column;
         gap: 15px;
        /* 
         background: #64696e;
         width: 200px;
         padding: 20px; 
        */
      }

      .profile {
         background: #00a8ff;
         padding: 20px;
         color: white;
        /* 
         background: #4b9ae9;
         width: 200px;
         color: white;
         padding: 20px; 
        */
      }

      .menu {
         background: #0097e6;
         padding: 20px;
         color: white;
         flex: 1;
        /*
         background: #2e89e4;
         width: 200px;
         color: white;
         padding: 20px; 
        */
      }

      /* 콘텐츠 */
      .content {
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: #f5f6fa;
      }

      /* 배너 */
      .banner {
         background: #e1b12c;
         padding: 20px;
        /* 
         background-color: orange;
         text-align: center;
         padding: 10px;
         color: black; 
        */
      }

      /* 카드 영역 */
      .cards {
         display: flex;
         gap: 15px;
        /*
         background-color: greenyellow;
         text-align: center;
         padding: 10px;
         color: white; 
        */
      }

      .card {
         flex: 1;
         display: flex;
         flex-direction: column;
         background: #ffffff;
         border: 1px solid #ccc;
        /*
          background-color: greenyellow;
         text-align: center;
         padding: 10px;
         color: white; 
        */
      }

      .card-header {
         background: #44bd32;
         padding: 10px;
         color: white;
        /* 
         background-color: white;
         text-align: center;
         padding: 10px;
         color: black; 
        */
      }

      .card-body {
         background: #f5f6fa;
         padding: 20px;
         flex: 1;
        /* 
         background-color: white;
         text-align: center;
         padding: 10px;
         color: black; 
        */
      }

      /* 위젯 */
      .widgets {
         display: flex;
         gap: 15px;
        /* 
         background-color: pink;
         text-align: center;
         padding: 10px;
         color: white; 
        */
      }

      .widget {
         flex: 1;
         background: #9c88ff;
         padding: 20px;
         color: white;
        /* 
         background-color: pink;
         text-align: center;
         padding: 10px;
         color: white;
         */
      }

      /* 푸터 */
      .footer {
         background: #2f3640;
         color: white;
         text-align: center;
         padding: 15px;
        /*
         background: #2c3e50;
         color: white;
         text-align: center;
         padding: 15px;
         */
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- 헤더 -->
      <header class="header">
        <div class="logo">로고</div>
        <div class="util">유틸 메뉴</div>
      </header>

      <!-- 메인 -->
      <div class="main">
        <!-- 사이드바 -->
        <aside class="sidebar">
          <div class="profile">프로필 박스</div>
          <div class="menu">메뉴 리스트</div>
        </aside>

        <!-- 콘텐츠 -->
        <section class="content">
          <div class="banner">상단 배너</div>

          <!-- 카드 영역 -->
          <div class="cards">
            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>

            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>

            <div class="card">
              <div class="card-header">카드 헤더</div>
              <div class="card-body">카드 본문</div>
            </div>
          </div>

          <!-- 위젯 영역 -->
          <div class="widgets">
            <div class="widget">위젯 A</div>
            <div class="widget">위젯 B</div>
          </div>
        </section>
      </div>

      <!-- 푸터 -->
      <footer class="footer">푸터</footer>
    </div>
  </body>
</html>
