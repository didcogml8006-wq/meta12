<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Recipes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Malgun Gothic", sans-serif; }
    body { background-color: #dbdbdb; color: #333; }

    .img-box {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #fff;
      border: 1px solid #bbb;
    }

    /* ================= HEADER ================= */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 60px; background-color: #dbdbdb;
    }
    .logo h1 { font-size: 24px; font-weight: 900; font-style: italic; }
    nav.menus { display: flex; gap: 20px; }
    nav.menus a { text-decoration: none; color: #000; font-size: 13px; font-weight: bold; }
    .search-bar { background: #eee; border-radius: 20px; padding: 5px 15px; border: 1px solid #ccc; display: flex; align-items: center; }
    .search-bar input { border: none; background: transparent; outline: none; width: 150px; }

    /* ================= HERO & MENU (동일) ================= */
    .hero { position: relative; height: 400px; padding: 0 60px; margin-top: 10px; }
    .hero-bg { display: flex; height: 100%; gap: 2px; }
    .hero-bg .box { flex: 1; }
    .hero-content {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background-color: #f1f1f1; padding: 40px 60px; border-radius: 10px;
      text-align: center; z-index: 2; width: 400px; border: 1px solid #ccc;
    }
    .hero-content h2 { font-size: 22px; margin-bottom: 15px; font-style: italic; font-weight: 900; }
    .hero-content p { font-size: 14px; color: #555; font-weight: bold; line-height: 1.6; }

    .section-container { padding: 40px 60px; }
    .section-header { margin-bottom: 30px; }
    .section-header h3 { font-size: 18px; font-style: italic; background: #eee; display: inline-block; padding: 5px 15px; border-radius: 15px; margin-bottom: 5px; }
    .section-header p { font-size: 13px; color: #666; font-weight: bold; padding-left: 10px; }

    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .menu-card { position: relative; }
    .menu-title { position: absolute; top: 15px; left: 15px; z-index: 5; font-weight: 900; font-size: 18px; color: #000; }
    .menu-layout { display: flex; gap: 10px; height: 350px; }
    .menu-main { flex: 2; border-radius: 8px; }
    .menu-sub { flex: 0.8; display: flex; flex-direction: column; gap: 10px; }
    .menu-sub-item { flex: 1; border-radius: 8px; }

    /* ================= CHEF SECTION (화살표 제거) ================= */
    .chef-section { background-color: #eee; padding: 40px 60px; margin-top: 40px; }
    .chef-section h3 { font-size: 18px; font-weight: 900; margin-bottom: 25px; }
    
    .chef-list { 
      display: flex; 
      align-items: center; 
      gap: 40px; 
      overflow-x: auto; /* 가로 스크롤 */
      white-space: nowrap; 
      padding: 10px 0 25px 0;
    }
    
    /* 스크롤바 디자인: 깔끔하게 아주 얇게 표시 */
    .chef-list::-webkit-scrollbar { height: 3px; }
    .chef-list::-webkit-scrollbar-track { background: transparent; }
    .chef-list::-webkit-scrollbar-thumb { background: #bbb; border-radius: 10px; }
    
    .chef-item { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chef-circle { width: 65px; height: 65px; border-radius: 50%; flex-shrink: 0; border: 3px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .chef-info { display: flex; flex-direction: column; gap: 4px; }
    .chef-name { font-size: 14px; font-weight: bold; color: #222; }
    .subscribe-btn { 
        font-size: 10px; padding: 4px 10px; background: #333; color: #fff; 
        border: none; border-radius: 20px; cursor: pointer;
    }

    /* ================= FOOTER ================= */
    footer { text-align: center; padding: 80px 20px; }
    footer p { font-size: 18px; font-weight: 900; margin-bottom: 20px; }
    .pride-btn { padding: 12px 35px; background-color: #333; color: #fff; font-weight: bold; border-radius: 30px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><h1>Healthy Recipes</h1></div>
    <nav class="menus"><a href="#">추천</a><a href="#">분류</a><a href="#">랭킹</a><a href="#">매거진</a><a href="#">더보기</a></nav>
    <div class="search-bar"><input type="text" placeholder="요리 검색..."><span>🔍</span></div>
  </header>

  <section class="hero">
    <div class="hero-bg">
      <div class="box img-box" style="background-image: url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=800')"></div>
      <div class="box img-box" style="background-image: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800')"></div>
    </div>
    <div class="hero-content">
      <h2>Don't give up on your health!</h2>
      <p>건강한 식단이 오늘보다<br>내일 너를 더 건강하게 해줄 거야.</p>
    </div>
  </section>

  <section class="section-container">
    <div class="section-header">
      <h3>The entire table menu</h3>
      <p>보기도 좋고, 몸에도 좋은 나의 완벽한 한상차림</p>
    </div>
    <div class="menu-grid">
      <div class="menu-card">
        <div class="menu-title">전체요리</div>
        <div class="menu-layout">
          <div class="menu-main img-box" style="background-image: url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600')"></div>
          <div class="menu-sub">
            <div class="menu-sub-item img-box" style="background-image: url('https://images.unsplash.com/photo-1541014741259-df529411b96a?w=400')"></div>
            <div class="menu-sub-item img-box" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400')"></div>
          </div>
        </div>
      </div>
      <div class="menu-card">
        <div class="menu-title">메인요리</div>
        <div class="menu-layout">
          <div class="menu-main img-box" style="background-image: url('https://images.unsplash.com/photo-1544025162-d76694265947?w=600')"></div>
          <div class="menu-sub">
            <div class="menu-sub-item img-box" style="background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400')"></div>
            <div class="menu-sub-item img-box" style="background-image: url('https://images.unsplash.com/photo-1567620905732-2d1ec7bb7445?w=400')"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="chef-section">
    <h3>쉐프 소개</h3>
    <div class="chef-list">
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200')"></div><div class="chef-info"><span class="chef-name">짱구</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=200')"></div><div class="chef-info"><span class="chef-name">도라에몽</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200')"></div><div class="chef-info"><span class="chef-name">피카츄</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200')"></div><div class="chef-info"><span class="chef-name">철수</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200')"></div><div class="chef-info"><span class="chef-name">유리</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200')"></div><div class="chef-info"><span class="chef-name">맹구</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=200')"></div><div class="chef-info"><span class="chef-name">둘리</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=200')"></div><div class="chef-info"><span class="chef-name">포로리</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200')"></div><div class="chef-info"><span class="chef-name">케로로</span><button class="subscribe-btn">구독하기</button></div></div>
      <div class="chef-item"><div class="chef-circle img-box" style="background-image: url('https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=200')"></div><div class="chef-info"><span class="chef-name">코로스케</span><button class="subscribe-btn">구독하기</button></div></div>
    </div>
  </section>

  <footer>
    <p>오늘도 나를 사랑하며, 예쁘게 먹었어요.</p>
    <button class="pride-btn">자랑 타임</button>
  </footer>

</body>
</html>
