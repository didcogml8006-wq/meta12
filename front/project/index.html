<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Recipes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Malgun Gothic", sans-serif; }
    body { background-color: #dbdbdb; color: #333; overflow-x: hidden; }

    .img-box {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #eee;
    }

    /* ================= HEADER ================= */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 60px; background-color: #dbdbdb;
    }
    
    .logo { 
      display: flex; 
      flex-direction: column; 
      align-items: center;    
      text-align: center;     
      line-height: 1.1; 
    }
    .logo h1 { 
      font-size: 24px; 
      font-weight: 900; 
      font-style: italic; 
      margin-bottom: 2px;     
    }
    .logo span { 
      font-size: 13px;        
      font-weight: 300; 
      color: #777; 
      letter-spacing: 2px;    
      text-transform: uppercase; 
    }

    nav.menus { display: flex; gap: 20px; }
    nav.menus a { text-decoration: none; color: #000; font-size: 13px; font-weight: bold; }
    
    /* 검색바 & 로그인 버튼 영역 */
    .header-right {
      display: flex;
      align-items: center;
      gap: 15px; /* 검색창과 로그인 버튼 사이 간격 */
    }

    .search-bar { 
      background: #fff; 
      border-radius: 20px; 
      padding: 8px 18px; 
      border: 1px solid #ccc; 
      display: flex; 
      align-items: center; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .search-bar input { 
      border: none; 
      background: transparent; 
      outline: none; 
      width: 180px; 
      font-size: 13px;
    }

    /* 로그인 버튼 스타일 */
    .login-btn {
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      background-color: #333;
      padding: 8px 20px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }
    .login-btn:hover {
      background-color: #555;
      transform: translateY(-1px);
    }

    /* ================= HERO (슬라이드 기능) ================= */
    .hero { position: relative; height: 450px; margin: 0 60px; overflow: hidden; border-radius: 15px; }
    .hero-slider {
      display: flex;
      width: 300%; 
      height: 100%;
      transition: transform 1s ease-in-out; 
    }
    .slide-group {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 0; 
    }
    .hero-bg-item { flex: 1; height: 100%; }

    .hero-content {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background-color: rgba(241, 241, 241, 0.9); padding: 40px 60px; border-radius: 15px;
      text-align: center; z-index: 10; width: 450px; border: 1px solid #ccc;
    }
    .hero-content h2 { font-size: 22px; margin-bottom: 15px; font-style: italic; font-weight: 900; }
    .hero-content p { font-size: 14px; color: #555; font-weight: bold; }

    /* ================= MENU GRID ================= */
    .section-container { padding: 40px 60px; }
    .section-header { margin-bottom: 30px; }
    .section-header h3 { font-size: 18px; font-style: italic; background: #fff; display: inline-block; padding: 5px 20px; border-radius: 20px; margin-bottom: 10px; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .menu-card { position: relative; }
    .menu-title { position: absolute; top: 20px; left: 20px; z-index: 5; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    .menu-layout { display: flex; gap: 10px; height: 350px; }
    .menu-main { flex: 2; border-radius: 12px; }
    .menu-sub { flex: 0.8; display: flex; flex-direction: column; gap: 10px; }
    .menu-sub-item { flex: 1; border-radius: 12px; }

    /* ================= CHEF SECTION ================= */
    .chef-section { background-color: #eee; padding: 60px 60px; margin-top: 40px; }
    .chef-section h3 { font-size: 20px; margin-bottom: 30px; font-weight: 900; }

    .chef-list { 
      display: flex; align-items: center; gap: 45px; overflow-x: auto; 
      padding: 10px 0 35px 0;
    }
    .chef-list::-webkit-scrollbar { height: 5px; }
    .chef-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

    .chef-item { display: inline-flex; align-items: center; gap: 18px; flex-shrink: 0; }
    .chef-circle { width: 75px; height: 75px; border-radius: 50%; flex-shrink: 0; border: 3px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.08); }

    .chef-info { 
      display: flex; 
      flex-direction: column; 
      gap: 10px;              
    }

    .chef-name { font-size: 15px; font-weight: bold; color: #333; }
    .subscribe-btn { 
      font-size: 11px; 
      padding: 6px 14px; 
      background: #333; 
      color: #fff; 
      border: none; 
      border-radius: 20px; 
      cursor: pointer; 
      transition: all 0.2s ease;
      text-align: center;
    }
    .subscribe-btn:hover { background: #555; transform: translateY(-1px); }

    /* ================= FOOTER ================= */
    footer { 
      text-align: center; 
      padding: 100px 20px; 
      background-color: #dbdbdb; 
    }

    footer p { 
      font-size: 16px; 
      color: #555; 
      margin-bottom: 30px; 
      font-weight: bold;
    }

    .pride-btn { 
      padding: 16px 50px; 
      background-color: #333; 
      color: #fff; 
      font-size: 15px;
      font-weight: 900; 
      border-radius: 40px; 
      border: none; 
      cursor: pointer; 
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .pride-btn:hover { 
      background-color: #555; 
      transform: translateY(-3px); 
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

    <div class="hero-content">

  <script>
    const slider = document.getElementById('heroSlider');
    let currentIndex = 0;
    const totalSlides = 3; 

    setInterval(() => {
      currentIndex = (currentIndex + 1) % totalSlides;
      slider.style.transform = `translateX(-${(currentIndex * 100) / totalSlides}%)`;
    }, 15000); 
  </script>
