<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사이드 모달 예제</title>
    <style>
      /* 초기화 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 버튼 스타일 */
      .btn {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        font-size: 1rem;
        transition: all 0.2s;
      }
      .btn-success {
        background: #11998e;
        background: linear-gradient(to right, #11998e, #38ef7d);
      }
      .btn-success:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
      }

      /* 모달 오버레이 */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        /* 사이드 모달은 우측 정렬을 위해 justify-content 사용 안 함 (absolute로 배치) */
      }
      .modal-overlay.active {
        display: block;
        animation: fadeIn 0.3s;
      }

      /* 사이드 모달 본체 */
      .modal-side {
        position: absolute;
        right: 0;
        top: 0;
        width: 100%;
        max-width: 400px; /* PC에서의 최대 너비 */
        height: 100%;
        background: white;
        box-shadow: -5px 0 25px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        animation: slideLeft 0.3s ease-out; /* 부드러운 슬라이딩 */
      }

      /* 모달 내부 구조 */
      .modal-header {
        padding: 20px 25px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fafafa;
      }
      .modal-header h3 {
        margin: 0;
        font-size: 1.25rem;
        color: #333;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #999;
      }
      .modal-close:hover {
        color: #333;
      }

      .modal-body {
        padding: 25px;
        flex: 1; /* 남은 공간 모두 차지 */
        overflow-y: auto; /* 내용 길어지면 스크롤 */
      }

      .modal-footer {
        padding: 20px;
        border-top: 1px solid #eee;
        text-align: right;
      }

      /* 폼 요소 스타일 (설정창 예시) */
      .form-group {
        margin-bottom: 25px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #555;
      }
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
      }

      /* 애니메이션 */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideLeft {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* 모바일 반응형 */
      @media (max-width: 480px) {
        .modal-side {
          max-width: 100%;
        } /* 모바일은 꽉 차게 */
      }
    </style>
  </head>
  <body>
    <button class="btn btn-success" onclick="openModal()">
      ⚙️ 설정 열기 (사이드 패널)
    </button>

    <div
      class="modal-overlay"
      id="modalOverlay"
      onclick="closeModalOnOverlay(event)"
    >
      <div class="modal-side">
        <div class="modal-header">
          <h3>⚙️ 환경 설정</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="margin-bottom: 20px; color: #666">
            화면 우측에서 슬라이드되는 패널입니다.
          </p>

          <div class="form-group">
            <label>🔔 알림 설정</label>
            <select>
              <option>모두 받기</option>
              <option>중요한 알림만</option>
              <option>받지 않기</option>
            </select>
          </div>

          <div class="form-group">
            <label>🌙 테마 설정</label>
            <select>
              <option>라이트 모드</option>
              <option>다크 모드</option>
              <option>시스템 설정 따름</option>
            </select>
          </div>

          <div class="form-group">
            <label>🌐 언어 (Language)</label>
            <select>
              <option>한국어</option>
              <option>English</option>
              <option>日本語</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-success" onclick="saveAndClose()">
            저장하기
          </button>
        </div>
      </div>
    </div>

    <script>
      const overlay = document.getElementById("modalOverlay");

      // 1. 사이드 모달 열기
      function openModal() {
        overlay.classList.add("active");
        document.body.style.overflow = "hidden"; // 배경 스크롤 막기
        document.addEventListener("keydown", handleEscKey);
      }

      // 2. 설정 저장 후 닫기
      function saveAndClose() {
        alert("설정이 저장되었습니다!");
        closeModal();
      }

      // 3. 모달 닫기 (공통)
      function closeModal() {
        overlay.classList.remove("active");
        document.body.style.overflow = ""; // 배경 스크롤 복구
        document.removeEventListener("keydown", handleEscKey);
      }

      // 오버레이 클릭 시 닫기
      function closeModalOnOverlay(e) {
        if (e.target === overlay) {
          closeModal();
        }
      }

      // ESC 키로 닫기
      function handleEscKey(e) {
        if (e.key === "Escape") {
          closeModal();
        }
      }
    </script>
  </body>
</html>
