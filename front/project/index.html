<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .topmenu {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            border: 1px solid black;
        }
        .menus {
            display: flex;
            gap: 20px;
        }
        .right_menu {
            display: flex;
            gap: 20px;
        }
        .search {
            width: 100px;
            height: 30px;
            background-color: khaki;
        }
        .icon {
            width: 30px;
            height: 30px;
            background-color: grey;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topmenu">
            <div>
                <p>Healthy Recipes</p>
                <p>Home-cooked meal</p>
            </div>
            <div class="menus">
                <div><a>추천</a></div>
                <div><a>분류</a></div>
                <div><a>랭킹</a></div>
                <div><a>매거진</a></div>
                <div><a>더보기</a></div>
            </div>
            <div class="right_menu">
                <div class="search"></div>
                <div class="icon"></div>
                <div class="icon"></div>
                <div class="icon"></div>
            </div>
        </div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>
</html>
